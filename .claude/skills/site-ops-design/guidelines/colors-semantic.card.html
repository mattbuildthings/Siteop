<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Success, warning, danger, info" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--color-bg)}.row{display:flex;gap:12px;height:150px;align-items:center;padding:0 16px;box-sizing:border-box}.pill{flex:1;height:56px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600}</style>
<div class="row">
<div class="pill" style="background:var(--color-success)">Success</div>
<div class="pill" style="background:var(--color-warning)">Warning</div>
<div class="pill" style="background:var(--color-danger)">Danger</div>
<div class="pill" style="background:var(--color-info)">Info</div>
</div>
