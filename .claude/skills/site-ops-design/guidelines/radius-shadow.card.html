<!-- @dsCard group="Spacing" viewport="700x160" name="Radius & shadow" subtitle="Modest radii, flat surfaces — border does the work, not shadow" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-sunken);padding:20px;box-sizing:border-box;font-family:var(--font-body);font-size:12px;color:var(--color-text-secondary);display:flex;gap:16px}.box{width:120px;height:100px;background:var(--color-surface);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}</style>
<div class="box" style="border-radius:var(--radius-sm);box-shadow:var(--shadow-inset)">4px inset</div>
<div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-sm)">8px sm shadow</div>
<div class="box" style="border-radius:var(--radius-lg);box-shadow:var(--shadow-md)">12px md shadow</div>
<div class="box" style="border-radius:var(--radius-lg);border:var(--border-width-strong) solid var(--color-primary)">12px strong border</div>
